name: Security

on:
  pull_request:
    branches: [main]

# Least-privilege default; individual jobs widen scope only where required.
permissions:
  contents: read

jobs:
  # Blocks a PR that ADDS (or bumps to) a gem with a known high/critical
  # advisory. Operates on the PR diff, so reviewers get a clear "this change
  # introduced the vuln" signal.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      # All third-party actions are pinned to a full-length commit SHA (not a
      # moving tag) to prevent supply-chain attacks via mutated/retagged refs.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Review dependency changes
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Auto-discovers EVERY Gemfile.lock in the repo and audits each against the
  # ruby-advisory-db, so a newly added nested folder is covered automatically —
  # no hardcoded path list to forget. Shipped paths BLOCK the PR; test / demo /
  # example / blind-spot paths are report-only.
  bundler-audit:
    name: bundler-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Ruby
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4 # v1.207.0
        with:
          ruby-version: '3.3'

      # Pinned version to keep the tool off the supply-chain attack surface.
      - name: Install bundler-audit
        run: gem install bundler-audit -v 0.9.3

      - name: Audit every Gemfile.lock (block shipped, report-only test/demo)
        shell: bash
        run: |
          set -uo pipefail
          bundler-audit update >/dev/null 2>&1 || true   # refresh ruby-advisory-db

          # Advisories explicitly downgraded to report-only (surfaced, won't block),
          # each with a justification. Keep this list short and reviewed:
          #  - CVE-2026-35611 / GHSA-h27x-rffw-24p4: addressable ReDoS. addressable
          #    is a TEST-only gem (pulled in by webmock) and is never shipped to
          #    SDK consumers, so it is not a release blocker.
          REPORT_ONLY_IDS="CVE-2026-35611 GHSA-h27x-rffw-24p4"

          shipped_failed=0
          printf '## 🔒 bundler-audit\n\n' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r lock; do
            dir=$(dirname "$lock")
            # Classify the directory: test/demo/example/blind-spot dirs => report-only.
            case "$dir" in
              *demo*|*example*|*e2e*|*fixture*|*sample*|*test*|*spec*) dir_mode=report-only ;;
              *) dir_mode=blocking ;;
            esac
            if out=$(cd "$dir" && bundler-audit check 2>&1); then
              printf -- '- ✅ `%s` — no known advisories\n' "$dir" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # Simple, actionable table on the PR check's Summary page.
            {
              printf '\n### `%s`\n\n' "$dir"
              printf '| Gem | Version | Severity | Advisory | Status | What to do |\n'
              printf '|-----|---------|----------|----------|--------|------------|\n'
            } >> "$GITHUB_STEP_SUMMARY"
            # Per-finding status (a finding is report-only if its dir is report-only
            # OR its advisory id is allow-listed). awk exits 1 if any finding blocks.
            if ! printf '%s\n' "$out" | awk -v dir_mode="$dir_mode" -v allow=" $REPORT_ONLY_IDS " '
              function flush(){ if(name=="")return; adv=(cve!=""?cve:ghsa);
                ro=(dir_mode=="report-only");
                if(index(allow," " cve " ")>0 || index(allow," " ghsa " ")>0) ro=1;
                status=ro?"🟡 report-only":"🔴 blocking";
                printf("| %s | %s | %s | [%s](%s) | %s | %s |\n",name,ver,crit,adv,url,status,sol) >> ENVIRON["GITHUB_STEP_SUMMARY"];
                if(ro) printf("::warning::%s %s (%s %s, report-only) — %s\n",name,ver,crit,adv,sol);
                else { printf("::error::%s %s (%s %s) — %s\n",name,ver,crit,adv,sol); blocking++ }
                name=ver=cve=ghsa=crit=url=sol="" }
              /^Name:/{flush();name=$2}
              /^Version:/{ver=$2} /^CVE:/{cve=$2} /^GHSA:/{ghsa=$2}
              /^Criticality:/{crit=$2} /^URL:/{url=$2}
              /^Solution:/{s=$0;sub(/^Solution: /,"",s);sol=s}
              END{flush(); exit (blocking>0?1:0)}
            '; then shipped_failed=1; fi
          done < <(find . -name Gemfile.lock -not -path '*/vendor/*' -not -path '*/.git/*' | sort)
          if [ "$shipped_failed" = 1 ]; then
            printf '\n> ❌ **Fix the 🔴 blocking gems above** (apply the "What to do" version, e.g. `bundle update <gem>`) before this PR can merge.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $shipped_failed

  # Static analysis (SAST) for the SDK source — catches injection/insecure
  # patterns in our own code, complementing the dependency checks above.
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
        with:
          languages: ruby

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@df409f7d9260372bd5f19e5b04e83cb3c43714ae # v3.27.9
